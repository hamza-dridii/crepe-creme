name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a deploy that's still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
          # Served from username.github.io/<repo>/ by default. Once you have your own domain, add it as the
          # repository variable CUSTOM_DOMAIN (Settings → Secrets and variables → Actions → Variables):
          # the site then builds for the domain's root and the CNAME below is published with it.
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}', github.event.repository.name) }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: ${{ vars.CUSTOM_DOMAIN }}
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy website"
